# Server
server.port=8080

# H2 database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Wipe DB on every restart (good for development)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 web console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson: serialize LocalDateTime as ISO-8601 string, not numeric

spring.jackson.default-property-inclusion=always

# CORS (optional, controller already handles it)
spring.web.cors.allowed-origins=http://localhost:5173