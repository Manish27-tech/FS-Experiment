
spring.application.name=backend
server.port=8080

# ==========================================
# Database Configuration (H2)
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# Kafka Producer
# ==========================================
spring.kafka.producer.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Producer sends JSON without Java type headers
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ==========================================
# Kafka Consumer
# ==========================================
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=post-processing-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegate JSON deserialization
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# IMPORTANT: Explicitly define the Java class for incoming JSON
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.backend.entity.ScheduledPost

# Ignore type headers and use the configured default type
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Restrict trusted classes to your entity package
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.backend.entity

# ==========================================
# Retry Configuration
# ==========================================
kafka.retry.max-attempts=3
kafka.retry.backoff-multiplier=2.0
kafka.retry.initial-interval=1000
